# CI（readme 17.6節）。PR と main への push で、lint・型チェック・テスト・ビルドを行う。
# AIエージェントの PR の守り（automation-guard）は automation-guard.yml にある。
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4
      # platform/backend/Dockerfile と同じ版
      - run: rustup toolchain install 1.90 --profile minimal --component clippy && rustup default 1.90
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/backend
      # cargo fmt はまだ通していない（docs/tasks/task.md）
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      # platform/web/Dockerfile と同じ版
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
