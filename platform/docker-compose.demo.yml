# デモ用ポートオーバーライド
# 既存コンテナとの競合を回避するため、ホスト側ポートを変更
# - Nginx:   80   → 3100
# - Backend: 8080 → 8082
# - Web:     3000 → 3000 (変更なし)
# - DB:      5432 → 5432 (変更なし)
services:
  db:
    container_name: expense_db_demo
    ports:
      - "5432:5432"

  backend:
    container_name: expense_backend_demo
    ports:
      - "8082:8080"

  web:
    container_name: expense_web_demo
    ports:
      - "3000:3000"

  nginx:
    container_name: expense_nginx_demo
    ports:
      - "3100:80"
