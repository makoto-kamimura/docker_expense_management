services:
  db:
    image: postgres:16-alpine
    container_name: expense_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-expense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-expense}
      POSTGRES_DB: ${POSTGRES_DB:-expense}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-expense}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../app/backend
      dockerfile: ../../platform/backend/Dockerfile
    container_name: expense_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-expense}:${POSTGRES_PASSWORD:-expense}@db:5432/${POSTGRES_DB:-expense}
      JWT_SECRET: ${JWT_SECRET:-please-change-me-in-production-this-is-not-secure}
      RUST_LOG: ${RUST_LOG:-info,sqlx=warn}
      BIND_ADDR: 0.0.0.0:8080
      UPLOAD_DIR: /data/uploads
    volumes:
      - backend_uploads:/data/uploads
    ports:
      - "8080:8080"

  web:
    build:
      context: ../app/web
      dockerfile: ../../platform/web/Dockerfile
    container_name: expense_web
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_URL: ${API_URL:-http://backend:8080}
      NODE_ENV: production
    ports:
      - "3000:3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: expense_nginx
    restart: unless-stopped
    depends_on:
      - web
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  db_data:
  backend_uploads:
