services:
  db:
    image: postgres:16-alpine
    container_name: expense_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-expense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-expense}
      POSTGRES_DB: ${POSTGRES_DB:-expense}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-expense}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../app/backend
      dockerfile: ../../platform/backend/Dockerfile
    container_name: expense_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-expense}:${POSTGRES_PASSWORD:-expense}@db:5432/${POSTGRES_DB:-expense}
      JWT_SECRET: ${JWT_SECRET:-please-change-me-in-production-this-is-not-secure}
      RUST_LOG: ${RUST_LOG:-info,sqlx=warn}
      BIND_ADDR: 0.0.0.0:8080
      UPLOAD_DIR: /data/uploads
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      # SSO (OpenID Connect, 任意)。OIDC_ISSUER・OIDC_CLIENT_ID・OIDC_CLIENT_SECRET のどれかが空なら無効
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REQUIRE_MFA: ${OIDC_REQUIRE_MFA:-true}
      OIDC_DISPLAY_NAME: ${OIDC_DISPLAY_NAME:-SSO}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3100}
      OIDC_MOBILE_REDIRECT_PREFIXES: ${OIDC_MOBILE_REDIRECT_PREFIXES:-expense://,exp://}
      OIDC_LINK_DENY_EMAIL_DOMAINS: ${OIDC_LINK_DENY_EMAIL_DOMAINS:-example.com}
      # 非常用: true にすると「SSO だけ」の人もパスワードでログインできる
      OIDC_ALLOW_PASSWORD_FOR_SSO_ONLY: ${OIDC_ALLOW_PASSWORD_FOR_SSO_ONLY:-false}
    volumes:
      - backend_uploads:/data/uploads
    ports:
      - "127.0.0.1:8082:8080"

  web:
    build:
      context: ../app/web
      dockerfile: ../../platform/web/Dockerfile
    container_name: expense_web
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_URL: ${API_URL:-http://backend:8080}
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: expense_nginx
    restart: unless-stopped
    depends_on:
      - web
      - backend
    ports:
      - "127.0.0.1:3100:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  db_data:
  backend_uploads:
